<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e1b" media="(prefers-color-scheme: dark)" />
    <title>Derse giriş — Dersler</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700&family=Inter:wght@400..800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-display: Fraunces, "Iowan Old Style", Georgia, serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --bg: #f4f5f9;
        --surface: #ffffff;
        --surface-2: #f8f9fc;
        --surface-3: #eef1f7;
        --line: #e1e5ee;
        --ink: #0e1426;
        --muted: #4a5470;
        --dim: #7b849e;
        --rose: #c53455;
        --lime: #3c8c21;
        --amber: #a56209;
        --primary: #0e1426;
        --primary-hover: #1c2542;
        --primary-ink: #ffffff;
        --shadow: 0 2px 4px rgba(14, 20, 38, 0.04), 0 14px 34px -10px rgba(14, 20, 38, 0.16);
        --shadow-lg: 0 8px 16px -6px rgba(14, 20, 38, 0.12), 0 44px 110px -24px rgba(14, 20, 38, 0.32);
        --edge: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0a0e1b;
        --surface: #121829;
        --surface-2: #0e1324;
        --surface-3: #192038;
        --line: rgba(164, 178, 220, 0.15);
        --ink: #f2f5ff;
        --muted: #a5aec8;
        --dim: #6f7994;
        --rose: #ff8098;
        --lime: #9ee06a;
        --amber: #f0b45c;
        --primary: #b9ee63;
        --primary-hover: #a9e648;
        --primary-ink: #16260a;
        --shadow: 0 2px 4px rgba(0, 0, 0, 0.3), 0 14px 34px -10px rgba(0, 0, 0, 0.6);
        --shadow-lg: 0 8px 16px -6px rgba(0, 0, 0, 0.5), 0 44px 110px -24px rgba(0, 0, 0, 0.75);
        --edge: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      * { box-sizing: border-box; }

      [hidden] { display: none !important; }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      .kart {
        width: 100%;
        max-width: 440px;
        padding: 36px 32px 28px;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: var(--surface);
        box-shadow: var(--shadow-lg), var(--edge);
      }

      .marka { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; color: var(--muted); text-decoration: none; }
      .marka svg { width: 26px; height: 26px; color: var(--ink); }

      h1 { margin: 22px 0 8px; font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; letter-spacing: -0.02em; }

      p.aciklama { margin: 0 0 22px; color: var(--muted); line-height: 1.6; font-size: 0.95rem; }

      label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }

      input {
        width: 100%;
        min-height: 56px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface-2);
        color: var(--ink);
        font-family: var(--font-mono);
        font-size: 1.15rem;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
        transition: border-color 180ms ease, box-shadow 180ms ease;
      }

      input::placeholder { font-family: var(--font-sans); letter-spacing: 0; text-transform: none; color: var(--dim); }
      input:focus { outline: none; border-color: color-mix(in srgb, var(--ink) 40%, var(--line)); box-shadow: var(--shadow); }

      .dugme {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 52px;
        padding: 0 18px;
        border: 1px solid transparent;
        border-radius: 16px;
        background: var(--primary);
        color: var(--primary-ink);
        font: inherit;
        font-weight: 650;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease;
      }

      .dugme:hover { background: var(--primary-hover); }
      .dugme:active { transform: translateY(1px); }
      .dugme[disabled] { opacity: 0.6; cursor: progress; }

      .dugme.ikincil { border-color: var(--line); background: var(--surface-2); color: var(--ink); }
      .dugme.ikincil:hover { background: var(--surface-3); }

      form .dugme { margin-top: 16px; }

      .dugmeler { display: grid; gap: 10px; margin-top: 18px; }
      .dugmeler.yan { grid-template-columns: 1fr 1fr; }

      .kutu {
        margin: 0 0 18px;
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.55;
      }

      .kutu b { color: var(--ink); font-weight: 650; }

      .kutu.uyari {
        border-color: color-mix(in srgb, var(--rose) 35%, var(--line));
        background: color-mix(in srgb, var(--rose) 8%, var(--surface));
        color: var(--rose);
      }

      .kutu.uyari b { color: inherit; }

      .kutu.tamam {
        border-color: color-mix(in srgb, var(--lime) 40%, var(--line));
        background: color-mix(in srgb, var(--lime) 9%, var(--surface));
      }

      .durum-satiri { display: flex; align-items: center; gap: 12px; }

      .rozet {
        flex: none;
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 12px;
        background: color-mix(in srgb, var(--lime) 16%, var(--surface));
        color: var(--lime);
      }

      .rozet svg { width: 20px; height: 20px; }

      .ipucu { margin: 18px 0 0; color: var(--muted); font-size: 0.88rem; line-height: 1.55; }
      .ipucu a { color: var(--ink); font-weight: 650; }

      .alt {
        margin: 22px 0 0;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.85rem;
      }

      .alt a { color: var(--muted); text-decoration: none; font-weight: 600; }
      .alt a:hover { color: var(--ink); text-decoration: underline; }

      .baglanti { color: inherit; font-weight: 650; }
    </style>
    <script>
      /* tema, boya öncesinde uygulansın: varsayılan açık */
      (function () {
        var mode = "light";
        try { if (localStorage.getItem("dersler-tema") === "dark") mode = "dark"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", mode);
      })();
    </script>
  </head>
  <body>
    <main class="kart">
      <a class="marka" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6.5C6.5 4.5 9.5 4.5 12 6.5c2.5-2 5.5-2 9-0V18c-3.5-2-6.5-2-9 0-2.5-2-5.5-2-9 0V6.5Z" />
          <path d="M12 6.5V18" opacity=".5" />
        </svg>
        Dersler
      </a>

      <h1 id="baslik">Derse giriş</h1>
      <p class="aciklama" id="aciklama">Öğretmeninizin verdiği ders kodunu yazın. Kod bu tarayıcıda açık kalır; her seferinde yeniden girmeniz gerekmez.</p>

      <p class="kutu uyari" id="uyari" role="alert" hidden></p>

      <!-- zaten girişliyken -->
      <section id="oturum" hidden>
        <div class="kutu">
          <div class="durum-satiri">
            <span class="rozet" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7" /></svg>
            </span>
            <span id="oturum-metin"></span>
          </div>
        </div>
        <div class="dugmeler">
          <a class="dugme" id="oturum-devam" href="/">Derslere dön</a>
        </div>
        <div class="dugmeler yan">
          <button class="dugme ikincil" type="button" id="baska-kod">Başka kod gir</button>
          <a class="dugme ikincil" href="/cikis" id="oturum-cikis">Çıkış yap</a>
        </div>
      </section>

      <!-- sunum bağlantısından gelip giriş yapınca -->
      <section id="basari" hidden>
        <div class="kutu tamam" id="basari-metin"></div>
        <div class="dugmeler">
          <a class="dugme" href="/">Ana sayfaya git</a>
        </div>
        <p class="ipucu">İndirme başlamadıysa <a id="basari-bag" href="/">buraya tıklayın</a>.</p>
      </section>

      <form id="form" novalidate>
        <label for="kod">Ders kodu</label>
        <input id="kod" name="kod" placeholder="örn. DRS-K7M2PX" autocomplete="off" autocapitalize="characters" spellcheck="false" required />
        <button class="dugme" type="submit" id="dugme">Derse gir</button>
      </form>

      <p class="ipucu" id="acik-ipucu" hidden></p>

      <p class="alt">
        <a href="/">Ana sayfa</a>
        <a href="/yonetim">Öğretmen girişi</a>
      </p>
    </main>

    <script>
      (function () {
        var form = document.getElementById("form");
        var alan = document.getElementById("kod");
        var dugme = document.getElementById("dugme");
        var uyari = document.getElementById("uyari");
        var oturum = document.getElementById("oturum");
        var basari = document.getElementById("basari");

        var METIN = {
          yok: "Bu kod tanınmadı. Harfleri ve çizgiyi olduğu gibi yazdığınızdan emin olun.",
          kapali: "Bu kod öğretmen tarafından kapatılmış.",
          "suresi-doldu": "Bu kodun süresi dolmuş. Öğretmeninizden yeni bir kod isteyin.",
          "cok-deneme": "Çok fazla deneme yapıldı. Birkaç dakika sonra tekrar deneyin.",
          ag: "Bağlantı kurulamadı. İnternetinizi kontrol edip tekrar deneyin.",
        };

        /* Elde geçmeyen bir kod varken (çerez duruyor) kapının söylediği neden */
        var ELDEKI = {
          "suresi-doldu": "Kodunuzun süresi doldu. Öğretmeninizden yeni bir kod isteyin.",
          kapali: "Kodunuz öğretmen tarafından kapatıldı.",
          silindi: "Kodunuz artık geçerli değil. Öğretmeninizden yeni bir kod isteyin.",
        };

        function uyar(metin) {
          uyari.textContent = metin;
          uyari.hidden = !metin;
        }

        /* Sınıf adı öğretmenin yazdığı serbest metin: metin olarak yerleşir. */
        function yaz(kap, parcalar) {
          kap.textContent = "";
          parcalar.forEach(function (p) {
            if (p.kalin) {
              var b = document.createElement("b");
              b.textContent = p.metin;
              kap.append(b);
            } else {
              kap.append(document.createTextNode(p.metin));
            }
          });
        }

        var sorgu = new URLSearchParams(location.search);

        /* Yalnızca bu sitedeki bir yola dönülür; dışarıya yönlendirme olmaz. */
        var hedef = sorgu.get("hedef") || "/";
        if (hedef !== "/" && !/^\/[^/\\]/.test(hedef)) hedef = "/";
        if (/^\/giris(\?|$)/.test(hedef)) hedef = "/";
        var sunumHedefi = /^\/sunum\//.test(hedef);

        if (sorgu.get("kod")) alan.value = sorgu.get("kod").toUpperCase();

        function formuGoster() {
          oturum.hidden = true;
          form.hidden = false;
          alan.focus();
          alan.select();
        }

        document.getElementById("baska-kod").addEventListener("click", formuGoster);

        /* ---- açılışta: ziyaretçi zaten girişli mi, elinde geçmeyen kod mu var ---- */
        fetch("/durum", { headers: { accept: "application/json" } })
          .then(function (c) { return c.ok ? c.json() : null; })
          .then(function (d) {
            if (!d) return;
            var yetkisiz = sorgu.get("durum") === "yetkisiz";

            if (d.rol === "ogrenci" || d.rol === "yonetici") {
              var n = (d.konular || []).length;
              yaz(document.getElementById("oturum-metin"), d.rol === "yonetici"
                ? [{ metin: "Yönetici", kalin: true }, { metin: " olarak girişlisiniz; bütün konular açık." }]
                : [{ metin: "Şu an " }, { metin: d.ad || d.kod, kalin: true }, { metin: " koduyla girişlisiniz · " + n + " konu açık." }]);

              document.getElementById("baslik").textContent = "Oturumunuz açık";
              document.getElementById("aciklama").textContent = d.rol === "yonetici"
                ? "Bir öğrenci kodu girerseniz yönetici oturumu kapanır."
                : "Başka bir sınıfın kodunu girerseniz o koda geçersiniz.";

              var devam = document.getElementById("oturum-devam");
              if (d.rol === "yonetici") {
                devam.textContent = "Yönetime git";
                devam.href = "/yonetim";
              } else if (!yetkisiz && hedef !== "/" && !sunumHedefi) {
                devam.href = hedef;
              }

              if (yetkisiz) {
                uyar(sunumHedefi
                  ? "Bu sunum kodunuzla indirilemiyor. İndirme izni olan başka bir kodunuz varsa girin."
                  : "Bu konu kodunuza açık değil. Başka bir kodunuz varsa girin.");
                oturum.hidden = false;
                form.hidden = false;
                alan.focus();
              } else {
                oturum.hidden = false;
                form.hidden = true;
              }
              return;
            }

            if (ELDEKI[d.sebep]) uyar(ELDEKI[d.sebep]);

            var acik = (d.herkeseAcik || []).length;
            if (acik > 0) {
              var ipucu = document.getElementById("acik-ipucu");
              ipucu.textContent = "Kodunuz yoksa da " + acik + " konuya bakabilirsiniz: ";
              var a = document.createElement("a");
              a.href = "/";
              a.textContent = "ana sayfaya git";
              ipucu.append(a, document.createTextNode("."));
              ipucu.hidden = false;
            }
            if (!alan.value) alan.focus();
          })
          .catch(function () { if (!alan.value) alan.focus(); });

        /* ---- kod gönderme ---- */
        form.addEventListener("submit", function (olay) {
          olay.preventDefault();
          var kod = alan.value.trim().toUpperCase();
          if (!kod) return alan.focus();

          uyar("");
          dugme.disabled = true;
          dugme.textContent = "Kontrol ediliyor…";

          function geriAl() {
            dugme.disabled = false;
            dugme.textContent = "Derse gir";
          }

          fetch("/giris", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ kod: kod }),
          })
            .then(function (c) { return c.json().then(function (v) { return { ok: c.ok, veri: v }; }); })
            .then(function (s) {
              if (!s.ok) {
                uyar(METIN[s.veri && s.veri.hata] || METIN.yok);
                geriAl();
                alan.select();
                return;
              }
              if (!sunumHedefi) {
                location.href = hedef;
                return;
              }
              /* Sunum indirmesi sayfadan ayrılmaz; öğrenci "Kontrol ediliyor…"
                 ekranında takılı kalmasın, ne olduğunu görsün. */
              form.hidden = true;
              oturum.hidden = true;
              document.getElementById("acik-ipucu").hidden = true;
              document.getElementById("baslik").textContent = "Giriş yapıldı";
              document.getElementById("aciklama").hidden = true;
              yaz(document.getElementById("basari-metin"), [
                { metin: s.veri.ad || kod, kalin: true },
                { metin: " koduyla girdiniz. Sunumun indirilmesi başladı." },
              ]);
              document.getElementById("basari-bag").href = hedef;
              basari.hidden = false;
              location.href = hedef;
            })
            .catch(function () {
              uyar(METIN.ag);
              geriAl();
            });
        });
      })();
    </script>
  </body>
</html>
