# dersler-web konteynerinin içindeki nginx yapılandırması.
# Kök olarak yalnızca /opt/dersler/dist bağlanır (salt-okunur).
#
# Erişim denetimi: konu sayfaları ve sunumlar auth_request ile dersler-kapi
# servisine sorulur. Kapı 204 derse dosya nginx tarafından sunulur; 401/403
# derse ziyaretçi giriş ekranına gönderilir. Dosyalar hiçbir zaman kapı
# üzerinden akmaz, yalnızca karar oradan gelir.
#
# Not: bu dosya konteynere tek tek değil, /opt/dersler/deploy dizini
# conf.d olarak bağlanarak girer; tek dosya bağlanırsa düzenleme yeni bir
# inode ürettiği için değişiklikler konteynere hiç ulaşmaz.
#
# Not: bir location add_header tanımladığı anda server düzeyindeki güvenlik
# başlıklarının tamamını kaybeder. Bu yüzden başlık ekleyen location'lar
# guvenlik-basliklar.inc dosyasını include eder; sade önbellek süreleri için
# add_header yerine expires kullanılır.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS'i NPM sonlandırır; mutlak yönlendirme http:// üretir. Göreli olsun.
    absolute_redirect off;

    # Kapı servisi adıyla çözülür; konteyner yeniden doğduğunda adres değişse
    # bile nginx'i yeniden başlatmak gerekmesin diye değişken + resolver.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $kapi "http://dersler-kapi:8080";

    include /etc/nginx/conf.d/guvenlik-basliklar.inc;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript image/svg+xml
               application/json application/manifest+json application/xml;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json application/manifest+json application/xml;

    # özel 404 sayfası; bilinmeyen yol ana sayfaya düşmez
    error_page 404 /404.html;
    location = /404.html { internal; expires -1; }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    # ---------------------------------------------------------------- kapı

    # auth_request hedefi: yalnızca karar sorar, gövde taşımaz.
    location = /yetki {
        internal;
        proxy_pass $kapi/yetki;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Ozgun-URI $request_uri;   # alt istekte $uri "/yetki" olur; kapı yolu kendisi düzler
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Yönlendirmenin kendisi de önbelleğe girmemeli: kenarda saklanan bir 302,
    # kodu olan öğrenciyi de giriş ekranına düşürürdü.
    location @girise {
        include /etc/nginx/conf.d/korunan-basliklar.inc;
        return 302 /giris?hedef=$request_uri;
    }
    location @yasak {
        include /etc/nginx/conf.d/korunan-basliklar.inc;
        return 302 /giris?durum=yetkisiz&hedef=$request_uri;
    }

    location = /giris   { proxy_pass $kapi; include /etc/nginx/conf.d/kapi-basliklar.inc; }
    location = /cikis   { proxy_pass $kapi; include /etc/nginx/conf.d/kapi-basliklar.inc; }
    location = /durum   { proxy_pass $kapi; include /etc/nginx/conf.d/kapi-basliklar.inc; }
    location /yonetim   { proxy_pass $kapi; include /etc/nginx/conf.d/kapi-basliklar.inc; }

    # ------------------------------------------------------------ açık alan

    location = / { expires -1; try_files /index.html =404; }
    location = /index.html { expires -1; }

    location = /manifest.webmanifest { default_type application/manifest+json; expires 1d; }
    location = /sitemap.xml { expires 1d; }
    location = /robots.txt { expires 1d; }

    # ---------------------------------------------------------- korunan alan

    # konu sayfaları: index.html ve 404.html yukarıda tam eşleşmeyle ayrıldı
    location ~* \.html$ {
        auth_request /yetki;
        error_page 401 = @girise;
        error_page 403 = @yasak;
        include /etc/nginx/conf.d/korunan-basliklar.inc;
    }

    # sunum desteleri: yalnızca indirme izni olan koda açılır
    location /sunum/ {
        auth_request /yetki;
        error_page 401 = @girise;
        error_page 403 = @yasak;
        include /etc/nginx/conf.d/korunan-basliklar.inc;
    }

    # --------------------------------------------------------------- varlık

    location ~* \.(?:css|js)$ { expires 1h; }
    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|woff2?)$ { expires 7d; }

    location / { try_files $uri $uri/ =404; }
}
