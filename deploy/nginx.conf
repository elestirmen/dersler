# dersler-web konteynerinin içindeki nginx yapılandırması.
# Kök olarak yalnızca /opt/dersler/dist bağlanır (salt-okunur).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    # içerik düzenlenip yenilenince anında görünsün
    location = / { add_header Cache-Control "no-cache, must-revalidate" always; try_files /index.html =404; }
    location / { try_files $uri $uri/ /index.html; }

    location ~* \.(?:css|js)$ { expires 1h; add_header Cache-Control "public, max-age=3600"; }
    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|woff2?)$ { expires 7d; add_header Cache-Control "public, max-age=604800"; }
}
