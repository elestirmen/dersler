# dersler-web konteynerinin içindeki nginx yapılandırması.
# Kök olarak yalnızca /opt/dersler/dist bağlanır (salt-okunur).
#
# Not: location bloklarında add_header kullanılmaz; kullanılsa server düzeyindeki
# güvenlik başlıkları o blokta kaybolur. Önbellek süreleri bu yüzden expires ile verilir.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript image/svg+xml
               application/json application/manifest+json application/xml;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json application/manifest+json application/xml;

    # özel 404 sayfası; bilinmeyen yol ana sayfaya düşmez
    error_page 404 /404.html;
    location = /404.html { internal; expires -1; }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    # içerik düzenlenip yenilenince anında görünsün
    location = / { expires -1; try_files /index.html =404; }
    location ~* \.html$ { expires -1; }

    location = /manifest.webmanifest { default_type application/manifest+json; expires 1d; }
    location = /sitemap.xml { expires 1d; }
    location = /robots.txt { expires 1d; }

    location ~* \.(?:css|js)$ { expires 1h; }
    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|woff2?)$ { expires 7d; }
    location ~* \.(?:pptx|zip)$ { expires 1d; }

    location / { try_files $uri $uri/ =404; }
}
